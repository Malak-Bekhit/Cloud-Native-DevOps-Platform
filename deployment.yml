apiVersion: v1
kind: Deployment
metadata:
  name: nginx-deployment
spec:
  replicas: 3
  selector: 
     matchlabels:
        app: nginx
  template:
    metadata:
    labels:
        app: nginx
  spec:     
    containers:
      - name: nginx1
        image: nginx
        ports:  
          - "8020:8020"
